name: Issue assignment

on:
    issues:
        types: [opened]

jobs:
    auto-assign:
        runs-on: ubuntu-latest
        permissions:
            issues: write
        steps:
            - name: 'Auto-assign issue'
              uses: pozil/auto-assign-issue@d6e511896e5f1d2408e74db74416647d8ff80c8c
              with:
                  assignees: jeyrb
                  numOfAssignee: 1
                  allowSelfAssign: true
                  repo-token: ${{ secrets.GITHUB_TOKEN  }}
