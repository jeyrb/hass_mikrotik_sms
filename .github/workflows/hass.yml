name: Validate with hassfest

on:
  push:
  pull_request:
  schedule:
    - cron:  '0 0 * * *'

permissions:
  contents: read

jobs:
  validate:
    runs-on: "ubuntu-latest"
    steps:
        - uses: "actions/checkout@v7.0.1"
        - uses: "home-assistant/actions/hassfest@06749dd8c0b54f350bc69c8752456cee498808a3"
