name: Validate with hassfest

on:
  push:
  pull_request:
  schedule:
    - cron:  '0 0 * * *'

permissions:
  contents: read

jobs:
  validate:
    runs-on: "ubuntu-latest"
    steps:
        - uses: "actions/checkout@v7.0.1"
        - uses: "home-assistant/actions/hassfest@50baf3a307f87100cf550d4ae127746595030d5d"
