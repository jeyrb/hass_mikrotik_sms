name: PR assignment

on:
    pull_request:
        types: [opened, edited, synchronize, reopened]

jobs:
    auto-assign:
        runs-on: ubuntu-latest
        permissions:
            pull-requests: write
            issues: write
        steps:
            - name: 'Auto-assign PR'
              uses: pozil/auto-assign-issue@d6e511896e5f1d2408e74db74416647d8ff80c8c
              with:
                  repo-token: ${{ secrets.GITHUB_TOKEN  }}
                  assignees: jeyrb
                  numOfAssignee: 1
                  allowSelfAssign: true
